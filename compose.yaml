services:
  firebase:
    build:
      context: .
      dockerfile: docker/firebase/Dockerfile
    ports:
      - "127.0.0.1:4100:4100"
      - "127.0.0.1:8180:8180"
      - "127.0.0.1:9199:9199"
      - "127.0.0.1:9250:9250"
    volumes:
      - ./.firebase/emulator-data:/data
    init: true
    stop_grace_period: 60s
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:4400/emulators').then(r=>r.json()).then(e=>{if(!e.auth||!e.firestore||!e.ui)process.exit(1)}).catch(()=>process.exit(1))"
      interval: 5s
      timeout: 3s
      start_period: 40s
      retries: 12
